[server]
address = "0.0.0.0"
port = 8501
headless = false
enableCORS = false
enableXsrfProtection = false
enableStaticServing = false

[browser]
gatherUsageStats = false
serverAddress = "localhost"
serverPort = 8501

[theme]
primaryColor = "#1D4ED8"
backgroundColor = "#F0F4FF"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0B1120"
font = "Inter, sans serif"

[client]
showErrorDetails = true
toolbarMode = "viewer"
